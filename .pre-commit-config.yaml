# Checks that run on your machine before each commit: a leaked-key scan of what you are committing and the lint rules.
# The same checks run again on GitHub, so skipping these only finds the problem later.
# Set up once: `uv tool install pre-commit`, then `pre-commit install` in this folder.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
