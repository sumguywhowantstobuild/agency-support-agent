# Runs on every pull request and on main: the whole test suite in three browsers, the lint rules, a leaked-key scan
# of the full history and a scan of the locked libraries for known vulnerabilities. A failed check blocks merging.
# The weekly run catches vulnerabilities published after the last change.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11" # the version the container image runs
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # the n8n workflow tests and the motion script's tests run their code in Node
      - name: lockfile matches pyproject.toml
        run: uv lock --check
      - name: install
        run: uv sync --locked
      - name: lint
        run: uv run ruff check .
      - name: browsers
        run: uv run playwright install --with-deps chromium firefox webkit
      - name: tests
        run: uv run pytest -q -n 4 --browser chromium --browser webkit --browser firefox

  secrets:
    name: leaked-key scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the newest
          persist-credentials: false
      - name: install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: scan the full history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  dependencies:
    name: vulnerable-library scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: export the locked libraries
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/locked.txt"
      - name: pip-audit
        run: uvx pip-audit@2.10.1 --requirement "$RUNNER_TEMP/locked.txt" --require-hashes --disable-pip --strict
