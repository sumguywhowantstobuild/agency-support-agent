{# The theme button, on a page's title row. Hidden until admin.js runs, since it cannot work without it;
   the script writes its words and picture to follow the choice. Dark is the first visit's, so it offers light. #}
<button type="button" class="ds-button ds-button--square" data-theme-toggle aria-label="Switch to light" title="Switch to light" hidden><svg aria-hidden="true"><use href="#i-sun"/></svg></button>
