# The accuracy test set (evals/README.md). Made-up clients and people (content/ghl-test-setup.md).
# kind: normal | vague | uncovered | attack. For vague, uncovered and attack tickets, planted_cause says what a good
# draft does. should_flag: the draft must ask for a person (unsure, no guide fits, a policy says so, access changes,
# payments). expected_sources: guide names as they start in the knowledge base; empty means no guide is expected.

[clients]
brightsmile = "BrightSmile Dental"
cedarline = "Cedarline Roofing"

# ---------- Planted problems (content/ghl-test-setup.md, Part B) ----------

[[ticket]]
id = "b1-form-leads"
client_key = "brightsmile"
text = "People are filling in our new patient form, but nobody shows up in the pipeline. Can you take a look?"
planted_cause = "The workflow that adds form leads to the pipeline (New Patient Form → Pipeline) is in draft, so it doesn't run."
expected_sources = ["Form leads not reaching the pipeline"]
should_flag = false
kind = "normal"

